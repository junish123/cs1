<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商场会员管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.cloudbase.net.cn/tcb/2.0/cloudbase.js"></script>
  <style>
    :root {
      --primary-dark: #1A1A2E;
      --accent-coral: #E94560;
      --bg-light: #F8F9FA;
      --card-white: #FFFFFF;
      --text-primary: #2C3E50;
      --text-secondary: #6C757D;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Source Sans Pro', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-primary);
    }
    
    .font-display {
      font-family: 'Playfair Display', serif;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: linear-gradient(180deg, #1A1A2E 0%, #16213E 100%);
      color: white;
      z-index: 1000;
      overflow-y: auto;
    }
    
    .sidebar-header {
      padding: 30px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .sidebar-logo {
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
    
    .sidebar-logo span {
      color: var(--accent-coral);
    }
    
    .nav-menu {
      padding: 20px 0;
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      transition: all 0.3s ease;
      border-left: 3px solid transparent;
    }
    
    .nav-item:hover,
    .nav-item.active {
      background: rgba(233, 69, 96, 0.1);
      color: white;
      border-left-color: var(--accent-coral);
    }
    
    .nav-item i {
      width: 24px;
      margin-right: 12px;
      font-size: 18px;
    }
    
    /* Main Content */
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
      padding: 30px;
    }
    
    .page-header {
      margin-bottom: 30px;
    }
    
    .page-title {
      font-size: 32px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 16px;
    }
    
    /* Cards */
    .card {
      background: var(--card-white);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 24px;
      margin-bottom: 24px;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--card-white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-coral);
    }
    
    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-dark);
      font-family: 'JetBrains Mono', monospace;
    }
    
    .stat-change {
      font-size: 13px;
      margin-top: 8px;
    }
    
    .stat-change.positive {
      color: #10B981;
    }
    
    .stat-change.negative {
      color: #EF4444;
    }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      outline: none;
    }
    
    .btn-primary {
      background: var(--accent-coral);
      color: white;
    }
    
    .btn-primary:hover {
      background: #D63D56;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
    }
    
    .btn-secondary {
      background: #F1F5F9;
      color: var(--text-primary);
    }
    
    .btn-secondary:hover {
      background: #E2E8F0;
    }
    
    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .data-table th {
      text-align: left;
      padding: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #F1F5F9;
    }
    
    .data-table td {
      padding: 16px;
      border-bottom: 1px solid #F1F5F9;
    }
    
    .data-table tr:hover {
      background: #FAFBFC;
    }
    
    /* Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .tag-success {
      background: #D1FAE5;
      color: #059669;
    }
    
    .tag-warning {
      background: #FEF3C7;
      color: #D97706;
    }
    
    .tag-danger {
      background: #FEE2E2;
      color: #DC2626;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #F1F5F9;
    }
    
    .modal-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .modal-footer {
      padding: 24px;
      border-top: 1px solid #F1F5F9;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    
    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent-coral);
    }
    
    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #F1F5F9;
      border-top-color: var(--accent-coral);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    
    .empty-icon {
      font-size: 64px;
      color: #E2E8F0;
      margin-bottom: 16px;
    }
    
    .empty-text {
      color: var(--text-secondary);
      font-size: 16px;
    }
    
    /* Login Page */
    .login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
    }
    
    .login-card {
      background: white;
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: center;
      margin-bottom: 32px;
    }
    
    /* Responsive */
    @media (max-width: 1200px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      
      .sidebar.open {
        transform: translateX(0);
      }
      
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Page Sections */
    .page-section {
      display: none;
    }
    
    .page-section.active {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <h1 class="login-title font-display">管理后台登录</h1>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">管理员账号</label>
          <input type="text" class="form-input" id="adminUsername" placeholder="请输入管理员账号" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="adminPassword" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          <i class="fas fa-sign-in-alt"></i>
          登录
        </button>
      </form>
      <p style="text-align: center; margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
        默认账号: admin / 密码: admin123
      </p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo font-display">VIP<span>Manager</span></div>
        <p style="color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 8px;">商场会员管理系统</p>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-line"></i>
          数据概览
        </a>
        <a href="#" class="nav-item" data-page="members">
          <i class="fas fa-users"></i>
          会员管理
        </a>
        <a href="#" class="nav-item" data-page="coupons">
          <i class="fas fa-ticket-alt"></i>
          优惠券管理
        </a>
        <a href="#" class="nav-item" data-page="products">
          <i class="fas fa-gift"></i>
          积分商品
        </a>
        <a href="#" class="nav-item" data-page="records">
          <i class="fas fa-history"></i>
          兑换记录
        </a>
      </nav>
      <div style="padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto;">
        <button id="logoutBtn" class="btn btn-secondary" style="width: 100%; background: rgba(255,255,255,0.1); color: white; border: none;">
          <i class="fas fa-sign-out-alt"></i>
          退出登录
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Dashboard Page -->
      <div id="page-dashboard" class="page-section active">
        <div class="page-header">
          <h1 class="page-title font-display">数据概览</h1>
          <p class="page-subtitle">实时查看会员系统运营数据</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">总会员数</div>
            <div class="stat-value" id="statTotalMembers">0</div>
            <div class="stat-change positive">
              <i class="fas fa-arrow-up"></i> 较上月 +12%
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">今日新增</div>
            <div class="stat-value" id="statNewMembers">0</div>
            <div class="stat-change positive">
              <i class="fas fa-arrow-up"></i> 较昨日 +5%
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">总积分发放</div>
            <div class="stat-value" id="statTotalPoints">0</div>
            <div class="stat-change positive">
              <i class="fas fa-arrow-up"></i> 较上月 +8%
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">优惠券领取</div>
            <div class="stat-value" id="statCouponCount">0</div>
            <div class="stat-change positive">
              <i class="fas fa-arrow-up"></i> 较上月 +15%
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">最近注册会员</h3>
            <button class="btn btn-secondary" onclick="navigateTo('members')">
              查看全部
            </button>
          </div>
          <div id="recentMembers">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Members Page -->
      <div id="page-members" class="page-section">
        <div class="page-header">
          <h1 class="page-title font-display">会员管理</h1>
          <p class="page-subtitle">管理商场会员信息</p>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">会员列表</h3>
            <div style="display: flex; gap: 12px;">
              <input type="text" class="form-input" placeholder="搜索会员..." style="width: 240px;" id="memberSearch">
              <button class="btn btn-primary" onclick="refreshMembers()">
                <i class="fas fa-sync-alt"></i>
                刷新
              </button>
            </div>
          </div>
          <div id="membersTable">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Coupons Page -->
      <div id="page-coupons" class="page-section">
        <div class="page-header">
          <h1 class="page-title font-display">优惠券管理</h1>
          <p class="page-subtitle">创建和管理优惠券活动</p>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">优惠券列表</h3>
            <button class="btn btn-primary" onclick="openCouponModal()">
              <i class="fas fa-plus"></i>
              新建优惠券
            </button>
          </div>
          <div id="couponsTable">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Page -->
      <div id="page-products" class="page-section">
        <div class="page-header">
          <h1 class="page-title font-display">积分商品</h1>
          <p class="page-subtitle">管理积分兑换商品</p>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">商品列表</h3>
            <button class="btn btn-primary" onclick="openProductModal()">
              <i class="fas fa-plus"></i>
              添加商品
            </button>
          </div>
          <div id="productsTable">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Records Page -->
      <div id="page-records" class="page-section">
        <div class="page-header">
          <h1 class="page-title font-display">兑换记录</h1>
          <p class="page-subtitle">查看积分兑换和优惠券领取记录</p>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">最近记录</h3>
          </div>
          <div id="recordsTable">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Coupon Modal -->
  <div id="couponModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">新建优惠券</h3>
      </div>
      <div class="modal-body">
        <form id="couponForm">
          <div class="form-group">
            <label class="form-label">优惠券名称</label>
            <input type="text" class="form-input" id="couponTitle" required>
          </div>
          <div class="form-group">
            <label class="form-label">优惠类型</label>
            <select class="form-input" id="couponType">
              <option value="discount">折扣券</option>
              <option value="cash">代金券</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">优惠金额/折扣</label>
            <input type="number" class="form-input" id="couponAmount" placeholder="折扣券填0-1之间，如0.8表示8折" required>
          </div>
          <div class="form-group">
            <label class="form-label">最低消费金额</label>
            <input type="number" class="form-input" id="couponMinAmount" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">发放数量</label>
            <input type="number" class="form-input" id="couponStock" required>
          </div>
          <div class="form-group">
            <label class="form-label">有效天数</label>
            <input type="number" class="form-input" id="couponValidDays" value="30">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('couponModal')">取消</button>
        <button class="btn btn-primary" onclick="saveCoupon()">
          <i class="fas fa-save"></i>
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">添加积分商品</h3>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <div class="form-group">
            <label class="form-label">商品名称</label>
            <input type="text" class="form-input" id="productName" required>
          </div>
          <div class="form-group">
            <label class="form-label">商品描述</label>
            <textarea class="form-input" id="productDesc" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">所需积分</label>
            <input type="number" class="form-input" id="productPoints" required>
          </div>
          <div class="form-group">
            <label class="form-label">库存数量</label>
            <input type="number" class="form-input" id="productStock" required>
          </div>
          <div class="form-group">
            <label class="form-label">商品图片URL</label>
            <input type="text" class="form-input" id="productImage" placeholder="可选，留空使用默认图片">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('productModal')">取消</button>
        <button class="btn btn-primary" onclick="saveProduct()">
          <i class="fas fa-save"></i>
          保存
        </button>
      </div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
