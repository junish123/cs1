<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据报表 - 商场会员管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --primary: #E94560; --secondary: #1A1A2E; }
    body { font-family: 'Source Sans Pro', sans-serif; background: #F5F7FA; }
    .sidebar { background: linear-gradient(180deg, var(--secondary) 0%, #16213E 100%); }
    .nav-item:hover, .nav-item.active { background: rgba(233, 69, 96, 0.2); border-left: 4px solid var(--primary); }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #FF6B6B 100%); }
    .report-card { transition: all 0.3s; cursor: pointer; }
    .report-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="min-h-screen">
  <div class="flex h-screen">
    <aside class="sidebar w-64 text-white flex flex-col">
      <div class="p-6 border-b border-gray-700">
        <h1 class="text-2xl font-bold flex items-center">
          <i class="fas fa-crown mr-3 text-yellow-400"></i>印象城会员管理
        </h1>
      </div>
      <nav class="flex-1 py-4">
        <a href="index.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-home w-6"></i><span>仪表盘</span></a>
        <a href="members.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-users w-6"></i><span>会员管理</span></a>
        <a href="coupons.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-ticket-alt w-6"></i><span>优惠券管理</span></a>
        <a href="points.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-coins w-6"></i><span>积分管理</span></a>
        <a href="orders.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-shopping-bag w-6"></i><span>订单管理</span></a>
        <a href="events.html" class="nav-item flex items-center px-6 py-3 text-gray-300"><i class="fas fa-calendar-alt w-6"></i><span>活动管理</span></a>
        <a href="reports.html" class="nav-item active flex items-center px-6 py-3 text-gray-300"><i class="fas fa-chart-bar w-6"></i><span>数据报表</span></a>
      </nav>
    </aside>

    <main class="flex-1 overflow-auto">
      <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-800">数据报表</h2>
        <button onclick="exportPDF()" class="bg-red-500 text-white px-4 py-2 rounded-lg">
          <i class="fas fa-file-pdf mr-2"></i>导出PDF
        </button>
      </header>

      <div class="p-8 space-y-6">
        <!-- 报表类型选择 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="report-card card p-6 border-l-4 border-pink-500" onclick="showReport('member')">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">会员分析报表</p>
                <p class="text-2xl font-bold mt-2">会员增长/活跃</p>
              </div>
              <div class="w-14 h-14 bg-pink-100 rounded-full flex items-center justify-center">
                <i class="fas fa-users text-pink-500 text-2xl"></i>
              </div>
            </div>
          </div>

          <div class="report-card card p-6 border-l-4 border-yellow-500" onclick="showReport('points')">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">积分分析报表</p>
                <p class="text-2xl font-bold mt-2">积分收支/兑换</p>
              </div>
              <div class="w-14 h-14 bg-yellow-100 rounded-full flex items-center justify-center">
                <i class="fas fa-coins text-yellow-500 text-2xl"></i>
              </div>
            </div>
          </div>

          <div class="report-card card p-6 border-l-4 border-blue-500" onclick="showReport('orders')">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">订单分析报表</p>
                <p class="text-2xl font-bold mt-2">销售/转化</p>
              </div>
              <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center">
                <i class="fas fa-shopping-bag text-blue-500 text-2xl"></i>
              </div>
            </div>
          </div>

          <div class="report-card card p-6 border-l-4 border-green-500" onclick="showReport('coupons')">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-gray-500 text-sm">优惠券报表</p>
                <p class="text-2xl font-bold mt-2">发放/核销</p>
              </div>
              <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center">
                <i class="fas fa-ticket-alt text-green-500 text-2xl"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- 会员分析报表 -->
        <div class="card p-6">
          <h3 class="text-xl font-bold mb-6">会员分析报表</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-50 p-4 rounded-lg text-center">
              <p class="text-gray-500 text-sm">新增会员</p>
              <p class="text-2xl font-bold text-pink-600">+1,256</p>
              <p class="text-xs text-green-500"><i class="fas fa-arrow-up"></i> 12.5%</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg text-center">
              <p class="text-gray-500 text-sm">活跃会员</p>
              <p class="text-2xl font-bold text-blue-600">8,420</p>
              <p class="text-xs text-green-500"><i class="fas fa-arrow-up"></i> 8.3%</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg text-center">
              <p class="text-gray-500 text-sm">会员留存率</p>
              <p class="text-2xl font-bold text-yellow-600">68.5%</p>
              <p class="text-xs text-red-500"><i class="fas fa-arrow-down"></i> 2.1%</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg text-center">
              <p class="text-gray-500 text-sm">人均消费</p>
              <p class="text-2xl font-bold text-purple-600">¥485</p>
              <p class="text-xs text-green-500"><i class="fas fa-arrow-up"></i> 5.7%</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
              <h4 class="font-semibold mb-3">会员增长趋势</h4>
              <canvas id="memberTrendReport" height="200"></canvas>
            </div>
            <div>
              <h4 class="font-semibold mb-3">会员等级分布</h4>
              <canvas id="memberLevelReport" height="200"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function initReportCharts() {
      new Chart(document.getElementById('memberTrendReport'), {
        type: 'line',
        data: {
          labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
          datasets: [{
            label: '新增会员', data: [850, 920, 1100, 1250, 1180, 1560],
            borderColor: '#E94560', backgroundColor: 'rgba(233, 69, 96, 0.1)', fill: true, tension: 0.4
          }, {
            label: '活跃会员', data: [3200, 3500, 4200, 4800, 5200, 5800],
            borderColor: '#4361EE', backgroundColor: 'rgba(67, 97, 238, 0.1)', fill: true, tension: 0.4
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });

      new Chart(document.getElementById('memberLevelReport'), {
        type: 'doughnut',
        data: {
          labels: ['普通会员', '银卡会员', '金卡会员', '黑卡会员'],
          datasets: [{
            data: [5800, 4200, 2100, 480],
            backgroundColor: ['#CD7F32', '#C0C0C0', '#FFD700', '#1A1A2E']
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function showReport(type) {
      console.log('显示报表:', type);
    }

    function exportPDF() {
      alert('PDF导出功能开发中');
    }

    initReportCharts();
  </script>
</body>
</html>
